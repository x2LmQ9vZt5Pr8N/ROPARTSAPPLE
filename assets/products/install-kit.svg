<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="100%" height="100%">
  <defs>
    <radialGradient id="ikBgGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#f8fafc"/>
    </radialGradient>
    <linearGradient id="tubeGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="50%" stop-color="#f1f5f9"/>
      <stop offset="100%" stop-color="#cbd5e1"/>
    </linearGradient>
    <linearGradient id="brassValve" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fef08a"/>
      <stop offset="45%" stop-color="#eab308"/>
      <stop offset="100%" stop-color="#a16207"/>
    </linearGradient>
    <linearGradient id="teflonBlue" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="100%" stop-color="#0284c7"/>
    </linearGradient>
    <filter id="ikShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="10" flood-color="#0f172a" flood-opacity="0.1"/>
    </filter>
  </defs>

  <rect width="200" height="200" fill="url(#ikBgGlow)"/>

  <!-- Base shadow -->
  <ellipse cx="100" cy="172" rx="60" ry="10" fill="#0f172a" opacity="0.08"/>

  <g filter="url(#ikShadow)">
    <!-- Coiled RO Water Tube (White) -->
    <ellipse cx="94" cy="116" rx="58" ry="46" fill="none" stroke="url(#tubeGrad)" stroke-width="12" stroke-linecap="round"/>
    <ellipse cx="94" cy="116" rx="46" ry="36" fill="none" stroke="#e2e8f0" stroke-width="2"/>
    <ellipse cx="98" cy="112" rx="48" ry="38" fill="none" stroke="url(#tubeGrad)" stroke-width="10" stroke-linecap="round"/>

    <!-- Teflon Tape Roll in center -->
    <g transform="translate(68, 86)">
      <circle cx="26" cy="26" r="24" fill="url(#teflonBlue)" stroke="#0369a1" stroke-width="1.5"/>
      <circle cx="26" cy="26" r="16" fill="#ffffff"/>
      <circle cx="26" cy="26" r="11" fill="#f1f5f9" stroke="#cbd5e1" stroke-width="1"/>
      <!-- Inner core hole -->
      <circle cx="26" cy="26" r="6" fill="#64748b"/>
    </g>

    <!-- Brass Diverter Ball Valve in Foreground -->
    <g transform="translate(112, 114)">
      <!-- Diverter body -->
      <rect x="0" y="8" width="34" height="16" rx="3" fill="url(#brassValve)" stroke="#a16207" stroke-width="1"/>
      <rect x="24" y="0" width="10" height="32" rx="2" fill="url(#brassValve)" stroke="#a16207" stroke-width="1"/>
      <!-- Blue handle lever -->
      <rect x="-6" y="2" width="22" height="6" rx="2" fill="#0284c7" stroke="#0369a1" stroke-width="1"/>
      <!-- 1/4 inch side outlet -->
      <rect x="10" y="24" width="8" height="12" rx="1.5" fill="#f8fafc" stroke="#94a3b8" stroke-width="0.8"/>
    </g>

    <!-- Blue Locking Clips Scatter -->
    <path d="M46 142 C44 138 52 136 56 140 C54 144 48 144 46 142 Z" fill="#0284c7"/>
    <path d="M58 148 C56 144 64 142 68 146 C66 150 60 150 58 148 Z" fill="#0284c7"/>
  </g>
</svg>
