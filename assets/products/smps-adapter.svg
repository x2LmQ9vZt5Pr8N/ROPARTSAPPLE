<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="100%" height="100%">
  <defs>
    <radialGradient id="smpsBg" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#f8fafc"/>
    </radialGradient>
    <linearGradient id="smpsBody" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#334155"/>
      <stop offset="50%" stop-color="#1e293b"/>
      <stop offset="100%" stop-color="#0f172a"/>
    </linearGradient>
    <filter id="smpsSh" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="10" flood-color="#0f172a" flood-opacity="0.12"/>
    </filter>
  </defs>
  <rect width="200" height="200" fill="url(#smpsBg)"/>
  <ellipse cx="100" cy="172" rx="55" ry="8" fill="#0f172a" opacity="0.08"/>
  <g filter="url(#smpsSh)">
    <!-- Adapter Body Box -->
    <rect x="54" y="48" width="92" height="88" rx="10" fill="url(#smpsBody)" stroke="#475569" stroke-width="1.5"/>
    <!-- LED Indicator -->
    <circle cx="70" cy="68" r="4" fill="#22c55e"/>
    <circle cx="70" cy="68" r="2" fill="#86efac"/>
    <!-- Label -->
    <rect x="66" y="80" width="68" height="42" rx="4" fill="#1e293b" stroke="#334155" stroke-width="1"/>
    <text x="100" y="94" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="7.5" font-weight="700" fill="#ffffff">SMPS ADAPTER</text>
    <text x="100" y="105" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="6.5" font-weight="600" fill="#38bdf8">24V DC • 2.5A</text>
    <text x="100" y="115" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="5" font-weight="500" fill="#94a3b8">INPUT: 140-280V AC</text>
    <!-- DC Output Cable grommet and cord -->
    <rect x="94" y="136" width="12" height="8" rx="2" fill="#0f172a"/>
    <path d="M100 144 C100 156 120 154 120 166" stroke="#0f172a" stroke-width="4" fill="none" stroke-linecap="round"/>
  </g>
</svg>
