<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="100%" height="100%">
  <defs>
    <radialGradient id="fsBg" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#f8fafc"/>
    </radialGradient>
    <linearGradient id="fsCase" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#334155"/>
      <stop offset="50%" stop-color="#1e293b"/>
      <stop offset="100%" stop-color="#0f172a"/>
    </linearGradient>
    <linearGradient id="fsPipe" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#cbd5e1"/>
      <stop offset="50%" stop-color="#f8fafc"/>
      <stop offset="100%" stop-color="#94a3b8"/>
    </linearGradient>
    <filter id="fsSh" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="6" stdDeviation="8" flood-color="#0f172a" flood-opacity="0.1"/>
    </filter>
  </defs>
  <rect width="200" height="200" fill="url(#fsBg)"/>
  <ellipse cx="100" cy="168" rx="60" ry="8" fill="#0f172a" opacity="0.08"/>
  <g filter="url(#fsSh)">
    <!-- Flow Pipe (White/Clear Nylon body) -->
    <rect x="36" y="120" width="128" height="28" rx="4" fill="url(#fsPipe)" stroke="#94a3b8" stroke-width="1.2"/>
    <rect x="28" y="116" width="12" height="36" rx="2" fill="#cbd5e1" stroke="#64748b" stroke-width="1"/>
    <rect x="160" y="116" width="12" height="36" rx="2" fill="#cbd5e1" stroke="#64748b" stroke-width="1"/>
    <!-- Sensor Transmitter Tower -->
    <rect x="84" y="96" width="32" height="26" fill="#1e293b" stroke="#0f172a" stroke-width="1"/>
    <!-- Digital Display Housing Head -->
    <rect x="64" y="44" width="72" height="54" rx="8" fill="url(#fsCase)" stroke="#475569" stroke-width="1.5"/>
    <!-- LCD Screen -->
    <rect x="74" y="52" width="52" height="26" rx="3" fill="#0284c7" stroke="#0369a1" stroke-width="1"/>
    <text x="100" y="66" text-anchor="middle" font-family="'Courier New', Courier, monospace" font-size="10" font-weight="700" fill="#ffffff" letter-spacing="1">125.4</text>
    <text x="100" y="75" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="5.5" font-weight="700" fill="#e0f2fe">LITRES / MIN</text>
    <!-- Buttons below screen -->
    <circle cx="86" cy="88" r="4" fill="#64748b"/>
    <circle cx="100" cy="88" r="4" fill="#0284c7"/>
    <circle cx="114" cy="88" r="4" fill="#64748b"/>
  </g>
</svg>
