<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="100%" height="100%">
  <defs>
    <radialGradient id="dpBg" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#f8fafc"/>
    </radialGradient>
    <linearGradient id="dpBody" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e293b"/>
      <stop offset="60%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#020617"/>
    </linearGradient>
    <linearGradient id="pvdfHead" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="50%" stop-color="#f1f5f9"/>
      <stop offset="100%" stop-color="#cbd5e1"/>
    </linearGradient>
    <filter id="dpSh" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="10" flood-color="#0f172a" flood-opacity="0.12"/>
    </filter>
  </defs>
  <rect width="200" height="200" fill="url(#dpBg)"/>
  <ellipse cx="100" cy="172" rx="55" ry="8" fill="#0f172a" opacity="0.08"/>
  <g filter="url(#dpSh)">
    <!-- Main Electronic Enclosure (PP Housing IP65) -->
    <rect x="68" y="44" width="76" height="88" rx="8" fill="url(#dpBody)" stroke="#334155" stroke-width="1.5"/>
    <!-- Control Panel Fascia -->
    <rect x="76" y="52" width="60" height="34" rx="4" fill="#0284c7" stroke="#0369a1" stroke-width="1"/>
    <text x="106" y="66" text-anchor="middle" font-family="'Courier New', Courier, monospace" font-size="10" font-weight="700" fill="#ffffff">5.2 L/H</text>
    <!-- Pulse LED Indicator -->
    <circle cx="86" cy="76" r="3" fill="#22c55e"/>
    <text x="110" y="78" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="6" font-weight="600" fill="#ffffff">STROKE RATE</text>
    <!-- Manual Stroke Adjustment Dial -->
    <circle cx="106" cy="106" r="14" fill="#334155" stroke="#64748b" stroke-width="1.5"/>
    <line x1="106" y1="92" x2="106" y2="100" stroke="#f8fafc" stroke-width="2"/>
    <!-- Liquid End (PVDF Dosing Head on left) -->
    <rect x="42" y="74" width="28" height="60" rx="4" fill="url(#pvdfHead)" stroke="#94a3b8" stroke-width="1.2"/>
    <!-- Suction / Discharge Valve Cartridges -->
    <rect x="50" y="52" width="12" height="24" rx="2" fill="#0284c7"/>
    <rect x="50" y="132" width="12" height="24" rx="2" fill="#0284c7"/>
    <!-- Bleed Valve Knob -->
    <circle cx="56" cy="94" r="5" fill="#ef4444"/>
    <!-- Base mounting feet -->
    <rect x="60" y="130" width="92" height="12" rx="3" fill="#0f172a"/>
  </g>
</svg>
