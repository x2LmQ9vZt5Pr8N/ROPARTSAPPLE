<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="100%" height="100%">
  <defs>
    <radialGradient id="frp4Bg" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#f8fafc"/>
    </radialGradient>
    <linearGradient id="frpBody" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="35%" stop-color="#f8fafc"/>
      <stop offset="70%" stop-color="#e2e8f0"/>
      <stop offset="100%" stop-color="#cbd5e1"/>
    </linearGradient>
    <linearGradient id="ssClamp" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#cbd5e1"/>
      <stop offset="50%" stop-color="#94a3b8"/>
      <stop offset="100%" stop-color="#64748b"/>
    </linearGradient>
    <filter id="frp4Sh" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="10" flood-color="#0f172a" flood-opacity="0.1"/>
    </filter>
  </defs>
  <rect width="200" height="200" fill="url(#frp4Bg)"/>
  <ellipse cx="100" cy="172" rx="72" ry="8" fill="#0f172a" opacity="0.08"/>
  <g filter="url(#frp4Sh)">
    <!-- Main FRP Cylinder (Horizontal view) -->
    <rect x="32" y="76" width="136" height="48" rx="8" fill="url(#frpBody)" stroke="#cbd5e1" stroke-width="1.5"/>
    <!-- Left Stainless Steel End Clamp & Flange -->
    <rect x="24" y="70" width="12" height="60" rx="3" fill="url(#ssClamp)" stroke="#475569" stroke-width="1.2"/>
    <rect x="16" y="88" width="10" height="24" rx="2" fill="#94a3b8" stroke="#475569" stroke-width="1"/>
    <!-- Right Stainless Steel End Clamp & Flange -->
    <rect x="164" y="70" width="12" height="60" rx="3" fill="url(#ssClamp)" stroke="#475569" stroke-width="1.2"/>
    <rect x="174" y="88" width="10" height="24" rx="2" fill="#94a3b8" stroke="#475569" stroke-width="1"/>
    <!-- Mounting Saddle Straps (Rubber/SS) -->
    <rect x="62" y="74" width="10" height="52" rx="2" fill="url(#ssClamp)"/>
    <rect x="128" y="74" width="10" height="52" rx="2" fill="url(#ssClamp)"/>
    <!-- Saddle feet -->
    <rect x="58" y="126" width="18" height="12" rx="2" fill="#334155"/>
    <rect x="124" y="126" width="18" height="12" rx="2" fill="#334155"/>
    <!-- Specifications on FRP Body -->
    <text x="100" y="102" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="8" font-weight="700" fill="#475569" letter-spacing="0.5">4040 FRP VESSEL</text>
    <text x="100" y="113" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="6.5" font-weight="600" fill="#0284c7">300 PSI</text>
  </g>
</svg>
