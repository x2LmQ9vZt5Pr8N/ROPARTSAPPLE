<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="100%" height="100%">
  <defs>
    <radialGradient id="frp8Bg" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#f8fafc"/>
    </radialGradient>
    <linearGradient id="vesselBody" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="30%" stop-color="#f8fafc"/>
      <stop offset="70%" stop-color="#e2e8f0"/>
      <stop offset="100%" stop-color="#cbd5e1"/>
    </linearGradient>
    <linearGradient id="ssRing" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#94a3b8"/>
      <stop offset="50%" stop-color="#64748b"/>
      <stop offset="100%" stop-color="#334155"/>
    </linearGradient>
    <filter id="frp8Sh" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="10" flood-color="#0f172a" flood-opacity="0.12"/>
    </filter>
  </defs>
  <rect width="200" height="200" fill="url(#frp8Bg)"/>
  <ellipse cx="100" cy="174" rx="76" ry="9" fill="#0f172a" opacity="0.08"/>
  <g filter="url(#frp8Sh)">
    <!-- Main Heavy Vessel Cylinder -->
    <rect x="28" y="70" width="144" height="60" rx="10" fill="url(#vesselBody)" stroke="#cbd5e1" stroke-width="1.8"/>
    <!-- Left Retaining Segment Ring & End Plug -->
    <rect x="18" y="64" width="14" height="72" rx="4" fill="url(#ssRing)" stroke="#1e293b" stroke-width="1.2"/>
    <rect x="10" y="86" width="10" height="28" rx="2" fill="#64748b"/>
    <!-- Right Retaining Segment Ring & End Plug -->
    <rect x="168" y="64" width="14" height="72" rx="4" fill="url(#ssRing)" stroke="#1e293b" stroke-width="1.2"/>
    <rect x="180" y="86" width="10" height="28" rx="2" fill="#64748b"/>
    <!-- Industrial Victaulic Side Ports (Feed & Reject) -->
    <rect x="46" y="52" width="16" height="20" rx="2" fill="url(#ssRing)"/>
    <rect x="138" y="52" width="16" height="20" rx="2" fill="url(#ssRing)"/>
    <!-- Heavy Duty Base Support Straps -->
    <rect x="64" y="68" width="12" height="64" fill="#334155"/>
    <rect x="124" y="68" width="12" height="64" fill="#334155"/>
    <rect x="58" y="132" width="24" height="14" rx="3" fill="#0f172a"/>
    <rect x="118" y="132" width="24" height="14" rx="3" fill="#0f172a"/>
    <!-- Vessel Identification -->
    <text x="100" y="98" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="8.5" font-weight="700" fill="#334155" letter-spacing="0.5">8040 FRP VESSEL</text>
    <text x="100" y="109" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="7" font-weight="600" fill="#0f766e">450 PSI SIDE PORT</text>
  </g>
</svg>
