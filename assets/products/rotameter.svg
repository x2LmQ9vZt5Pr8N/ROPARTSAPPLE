<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="100%" height="100%">
  <defs>
    <radialGradient id="rmBg" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#f8fafc"/>
    </radialGradient>
    <linearGradient id="acrylicGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#f0f9ff"/>
      <stop offset="30%" stop-color="#ffffff"/>
      <stop offset="70%" stop-color="#e0f2fe"/>
      <stop offset="100%" stop-color="#bae6fd"/>
    </linearGradient>
    <filter id="rmSh" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="10" flood-color="#0f172a" flood-opacity="0.12"/>
    </filter>
  </defs>
  <rect width="200" height="200" fill="url(#rmBg)"/>
  <ellipse cx="100" cy="182" rx="42" ry="7" fill="#0f172a" opacity="0.08"/>
  <g filter="url(#rmSh)">
    <!-- Top & Bottom Panel Bulkhead Mounts (SS / PVC) -->
    <rect x="74" y="24" width="52" height="18" rx="3" fill="#1e293b" stroke="#0f172a" stroke-width="1.2"/>
    <rect x="84" y="14" width="32" height="12" rx="2" fill="#94a3b8" stroke="#475569" stroke-width="1"/>
    <rect x="74" y="154" width="52" height="18" rx="3" fill="#1e293b" stroke="#0f172a" stroke-width="1.2"/>
    <rect x="84" y="170" width="32" height="12" rx="2" fill="#94a3b8" stroke="#475569" stroke-width="1"/>
    <!-- Clear Cast Acrylic Body Block -->
    <rect x="78" y="40" width="44" height="116" rx="4" fill="url(#acrylicGrad)" stroke="#7dd3fc" stroke-width="1.5"/>
    <!-- Internal Tapered Glass/Acrylic Flow Tube -->
    <polygon points="90,46 110,46 106,150 94,150" fill="#ffffff" opacity="0.9" stroke="#94a3b8" stroke-width="0.8"/>
    <!-- Stainless Steel Float (Bullet/Cone Shaped) inside tube -->
    <polygon points="100,90 94,104 106,104" fill="#0284c7" stroke="#0369a1" stroke-width="1"/>
    <!-- Graduation Marks & Scale (LPH) -->
    <line x1="84" y1="56" x2="90" y2="56" stroke="#0f172a" stroke-width="1"/>
    <text x="80" y="58" text-anchor="end" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="5" font-weight="700" fill="#475569">1500</text>
    <line x1="84" y1="80" x2="90" y2="80" stroke="#0f172a" stroke-width="1"/>
    <text x="80" y="82" text-anchor="end" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="5" font-weight="700" fill="#475569">1000</text>
    <line x1="84" y1="104" x2="90" y2="104" stroke="#0f172a" stroke-width="1"/>
    <text x="80" y="106" text-anchor="end" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="5" font-weight="700" fill="#475569">500</text>
    <line x1="84" y1="128" x2="90" y2="128" stroke="#0f172a" stroke-width="1"/>
    <text x="80" y="130" text-anchor="end" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="5" font-weight="700" fill="#475569">100</text>
    <text x="100" y="166" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="6" font-weight="700" fill="#ffffff">LPH</text>
  </g>
</svg>
