<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="100%" height="100%">
  <defs>
    <radialGradient id="svBgGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#f8fafc"/>
    </radialGradient>
    <linearGradient id="coilGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e293b"/>
      <stop offset="50%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#020617"/>
    </linearGradient>
    <linearGradient id="bodyGradSV" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="40%" stop-color="#f1f5f9"/>
      <stop offset="80%" stop-color="#e2e8f0"/>
      <stop offset="100%" stop-color="#cbd5e1"/>
    </linearGradient>
    <linearGradient id="brassGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#fef08a"/>
      <stop offset="50%" stop-color="#eab308"/>
      <stop offset="100%" stop-color="#ca8a04"/>
    </linearGradient>
    <linearGradient id="blueClipSV" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="100%" stop-color="#0284c7"/>
    </linearGradient>
    <filter id="svShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="6" stdDeviation="8" flood-color="#0f172a" flood-opacity="0.1"/>
    </filter>
  </defs>

  <rect width="200" height="200" fill="url(#svBgGlow)"/>

  <!-- Base soft contact shadow -->
  <ellipse cx="100" cy="166" rx="55" ry="9" fill="#0f172a" opacity="0.08"/>

  <g filter="url(#svShadow)">
    <!-- Terminal Pins on Top -->
    <rect x="88" y="30" width="4" height="12" rx="1" fill="#cbd5e1" stroke="#94a3b8" stroke-width="0.8"/>
    <rect x="108" y="30" width="4" height="12" rx="1" fill="#cbd5e1" stroke="#94a3b8" stroke-width="0.8"/>

    <!-- Black Coil Head -->
    <rect x="74" y="38" width="52" height="54" rx="6" fill="url(#coilGrad)" stroke="#334155" stroke-width="1.5"/>
    <rect x="78" y="44" width="44" height="18" rx="3" fill="#1e293b" opacity="0.6"/>
    <!-- Voltage Label -->
    <text x="100" y="56" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="8" font-weight="700" fill="#94a3b8" letter-spacing="0.5">24V DC</text>

    <!-- Brass / Metal Hex Spacer -->
    <rect x="84" y="92" width="32" height="10" rx="1" fill="url(#brassGrad)" stroke="#a16207" stroke-width="1"/>

    <!-- Main Valve Body (White Molded POM) -->
    <rect x="62" y="102" width="76" height="46" rx="6" fill="url(#bodyGradSV)" stroke="#cbd5e1" stroke-width="1.5"/>

    <!-- Flow indicator on body -->
    <path d="M94 125 L106 125 M102 121 L106 125 L102 129" stroke="#64748b" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>

    <!-- Left Push-Fit Port -->
    <rect x="42" y="112" width="20" height="26" rx="3" fill="url(#bodyGradSV)" stroke="#cbd5e1" stroke-width="1.2"/>
    <rect x="34" y="115" width="8" height="20" rx="2" fill="#ffffff" stroke="#94a3b8" stroke-width="1"/>
    <!-- Blue clip left -->
    <rect x="38" y="114" width="4" height="22" rx="1" fill="url(#blueClipSV)"/>

    <!-- Right Push-Fit Port -->
    <rect x="138" y="112" width="20" height="26" rx="3" fill="url(#bodyGradSV)" stroke="#cbd5e1" stroke-width="1.2"/>
    <rect x="158" y="115" width="8" height="20" rx="2" fill="#ffffff" stroke="#94a3b8" stroke-width="1"/>
    <!-- Blue clip right -->
    <rect x="158" y="114" width="4" height="22" rx="1" fill="url(#blueClipSV)"/>
  </g>
</svg>
