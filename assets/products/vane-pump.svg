<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="100%" height="100%">
  <defs>
    <radialGradient id="vpBg" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#f8fafc"/>
    </radialGradient>
    <linearGradient id="vpBrass" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fef08a"/>
      <stop offset="40%" stop-color="#eab308"/>
      <stop offset="85%" stop-color="#ca8a04"/>
      <stop offset="100%" stop-color="#854d0e"/>
    </linearGradient>
    <linearGradient id="vpSS" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#f1f5f9"/>
      <stop offset="50%" stop-color="#cbd5e1"/>
      <stop offset="100%" stop-color="#94a3b8"/>
    </linearGradient>
    <filter id="vpSh" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="10" flood-color="#0f172a" flood-opacity="0.1"/>
    </filter>
  </defs>
  <rect width="200" height="200" fill="url(#vpBg)"/>
  <ellipse cx="100" cy="170" rx="55" ry="8" fill="#0f172a" opacity="0.08"/>
  <g filter="url(#vpSh)">
    <!-- Motor Mounting Flange (V-Band Clamp) -->
    <rect x="42" y="70" width="18" height="60" rx="4" fill="url(#vpSS)" stroke="#64748b" stroke-width="1.2"/>
    <!-- Drive Shaft Hub -->
    <rect x="32" y="88" width="12" height="24" rx="2" fill="#475569"/>
    <!-- Main Pump Body (Heavy Brass Casting) -->
    <rect x="60" y="62" width="76" height="76" rx="10" fill="url(#vpBrass)" stroke="#a16207" stroke-width="1.5"/>
    <ellipse cx="98" cy="100" rx="26" ry="26" fill="url(#vpBrass)" stroke="#78350f" stroke-width="1"/>
    <!-- Threaded Inlet & Outlet Ports (3/8" NPT) -->
    <rect x="80" y="38" width="22" height="26" rx="3" fill="url(#vpBrass)" stroke="#a16207" stroke-width="1.2"/>
    <rect x="80" y="136" width="22" height="26" rx="3" fill="url(#vpBrass)" stroke="#a16207" stroke-width="1.2"/>
    <!-- Internal hex relief valve screw -->
    <circle cx="136" cy="100" r="10" fill="url(#vpSS)" stroke="#64748b" stroke-width="1"/>
    <rect x="133" y="95" width="6" height="10" fill="#334155"/>
    <text x="98" y="104" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="8" font-weight="700" fill="#78350f">50 LPH</text>
  </g>
</svg>
