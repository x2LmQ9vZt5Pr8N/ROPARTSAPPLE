<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="100%" height="100%">
  <defs>
    <radialGradient id="tkBg" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#f8fafc"/>
    </radialGradient>
    <linearGradient id="tkBody" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="35%" stop-color="#f8fafc"/>
      <stop offset="70%" stop-color="#e2e8f0"/>
      <stop offset="100%" stop-color="#cbd5e1"/>
    </linearGradient>
    <filter id="tkSh" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="10" flood-color="#0f172a" flood-opacity="0.1"/>
    </filter>
  </defs>
  <rect width="200" height="200" fill="url(#tkBg)"/>
  <ellipse cx="100" cy="176" rx="55" ry="9" fill="#0f172a" opacity="0.08"/>
  <g filter="url(#tkSh)">
    <!-- Top Stainless/Brass Port -->
    <rect x="94" y="32" width="12" height="14" rx="2" fill="#ca8a04"/>
    <rect x="92" y="24" width="16" height="8" rx="2" fill="#38bdf8"/>
    <!-- Tank Main Sphere/Capsule Body -->
    <rect x="52" y="46" width="96" height="110" rx="36" fill="url(#tkBody)" stroke="#cbd5e1" stroke-width="1.5"/>
    <!-- Center Seam Weld Ring -->
    <line x1="52" y1="101" x2="148" y2="101" stroke="#cbd5e1" stroke-width="1.5"/>
    <!-- Base Tank Stand Ring -->
    <ellipse cx="100" cy="160" rx="36" ry="8" fill="#1e293b"/>
    <!-- Label -->
    <text x="100" y="94" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="8.5" font-weight="700" fill="#0f172a">RO STORAGE TANK</text>
    <text x="100" y="112" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="7" font-weight="600" fill="#0284c7">8 LITRE (PRESSURE)</text>
  </g>
</svg>
